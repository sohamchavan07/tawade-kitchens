services:
  - type: web
    name: full-backend
    runtime: ruby
    buildCommand: ./bin/render-build.sh
    startCommand: ./bin/thrust ./bin/rails server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: full-backend-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: NODE_VERSION
        value: 22.22.1
      - key: RAILS_ENV
        value: production

databases:
  - name: full-backend-db
    plan: free
